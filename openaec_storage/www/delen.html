{% extends "templates/web.html" %}

{% block page_content %}
<div class="oas-delen" data-token="{{ token | e }}">
	<h1 class="oas-titel">Gedeeld via OpenAEC Storage</h1>
	<form class="oas-wachtwoord" hidden>
		<p>Deze link is beveiligd met een wachtwoord.</p>
		<input type="password" class="form-control" placeholder="Wachtwoord" autocomplete="current-password">
		<button type="submit" class="btn btn-primary btn-sm">Openen</button>
	</form>
	<p class="oas-melding text-muted">Laden…</p>
	<nav class="oas-pad"></nav>
	<ul class="oas-lijst list-unstyled"></ul>
	<section class="oas-aanleveren" hidden>
		<p class="oas-uitleg"></p>
		<label class="oas-afzender">Je naam (optioneel)
			<input type="text" class="form-control" maxlength="140" autocomplete="name">
		</label>
		<label class="oas-vak">
			<input type="file" multiple hidden>
			<span>Sleep bestanden hierheen of <u>kies bestanden</u></span>
		</label>
		<ul class="oas-voortgang list-unstyled"></ul>
	</section>
</div>
<style>
	.oas-delen { max-width: 720px; margin: 2rem auto; }
	.oas-titel { font-size: 1.4rem; margin-bottom: 1rem; }
	.oas-wachtwoord { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
	.oas-wachtwoord p { width: 100%; margin: 0; }
	.oas-wachtwoord input { max-width: 260px; }
	.oas-pad button { border: none; background: none; padding: 0; color: var(--primary); }
	.oas-lijst li { display: flex; justify-content: space-between; gap: 1rem; padding: .6rem 0; border-top: 1px solid var(--border-color); }
	.oas-lijst button { border: none; background: none; padding: 0; text-align: left; color: var(--primary); }
	.oas-grootte { color: var(--text-muted); white-space: nowrap; }
	.oas-afzender { display: block; max-width: 320px; margin-bottom: 1rem; }
	.oas-vak { display: block; border: 2px dashed var(--border-color); border-radius: .5rem; padding: 2rem 1rem;
		text-align: center; cursor: pointer; color: var(--text-muted); }
	.oas-vak.oas-erboven { border-color: var(--primary); color: var(--primary); }
	.oas-voortgang li { display: flex; justify-content: space-between; gap: 1rem; padding: .5rem 0;
		border-top: 1px solid var(--border-color); }
	.oas-voortgang .oas-fout { color: var(--red-600, #c0392b); }
</style>
{% endblock %}

{% block script %}
<script>
(() => {
	const root = document.querySelector(".oas-delen")
	const token = root.dataset.token
	const melding = root.querySelector(".oas-melding")
	const lijst = root.querySelector(".oas-lijst")
	const pad = root.querySelector(".oas-pad")
	const form = root.querySelector(".oas-wachtwoord")
	let wachtwoord = ""
	const spoor = []

	const grootte = (b) => {
		const e = ["B", "kB", "MB", "GB", "TB"]
		let i = 0
		while (b >= 1024 && i < e.length - 1) { b /= 1024; i++ }
		return `${b.toFixed(i ? 1 : 0)} ${e[i]}`
	}

	const roep = async (methode, gegevens) => {
		const r = await fetch(`/api/method/openaec_storage.delen.${methode}`, {
			method: "POST",
			headers: { "Content-Type": "application/json", "Accept": "application/json" },
			body: JSON.stringify({ token, wachtwoord: wachtwoord || null, ...gegevens }),
		})
		const data = await r.json().catch(() => ({}))
		if (!r.ok) {
			let tekst = "Deze link is niet (meer) geldig"
			try { tekst = JSON.parse(JSON.parse(data._server_messages)[0]).message } catch (e) {}
			throw new Error(tekst)
		}
		return data.message
	}

	const regel = (naam, extra, actie) => {
		const li = document.createElement("li")
		const knop = document.createElement("button")
		knop.textContent = naam
		knop.addEventListener("click", actie)
		const rechts = document.createElement("span")
		rechts.className = "oas-grootte"
		rechts.textContent = extra
		li.append(knop, rechts)
		lijst.append(li)
	}

	const download = async (bestand) => {
		try {
			const { url } = await roep("download", bestand ? { bestand } : {})
			window.location.href = url
		} catch (e) { melding.textContent = e.message }
	}

	const toonPad = () => {
		pad.replaceChildren()
		spoor.forEach((stap, i) => {
			if (i) pad.append(" / ")
			const b = document.createElement("button")
			b.textContent = stap.naam || "…"
			b.addEventListener("click", () => { spoor.length = i + 1; laad() })
			pad.append(b)
		})
	}

	const laad = async () => {
		melding.textContent = "Laden…"
		lijst.replaceChildren()
		try {
			const map = spoor.length ? spoor[spoor.length - 1].map : null
			const inhoud = await roep("openen", map ? { map } : {})
			form.hidden = true
			if (inhoud.uploaden) {
				toonAanleveren(inhoud)
				return
			}
			if (inhoud.bestand) {
				melding.textContent = ""
				regel(inhoud.bestand.naam, grootte(inhoud.bestand.grootte), () => download(null))
				return
			}
			if (!spoor.length) spoor.push({ map: null, naam: inhoud.map })
			toonPad()
			melding.textContent = inhoud.mappen.length || inhoud.bestanden.length ? "" : "Deze map is leeg."
			inhoud.mappen.forEach((m) => regel(`📁 ${m.naam}`, "", () => { spoor.push({ map: m.name, naam: m.naam }); laad() }))
			inhoud.bestanden.forEach((b) => regel(b.naam, grootte(b.grootte), () => download(b.name)))
		} catch (e) {
			melding.textContent = e.message
			if (/wachtwoord/i.test(e.message)) form.hidden = false
		}
	}

	// Bestanden opvragen: alleen aanleveren, de inhoud van de map blijft verborgen.
	const aanleveren = root.querySelector(".oas-aanleveren")
	const vak = aanleveren.querySelector(".oas-vak")
	const kiezer = vak.querySelector("input")
	const afzender = aanleveren.querySelector(".oas-afzender input")
	const voortgang = aanleveren.querySelector(".oas-voortgang")
	let maximum = 0
	let wachtrij = Promise.resolve()

	const toonAanleveren = (inhoud) => {
		melding.textContent = ""
		maximum = inhoud.max_grootte
		root.querySelector(".oas-titel").textContent = "Bestanden aanleveren"
		aanleveren.querySelector(".oas-uitleg").textContent =
			`Lever hier bestanden aan voor "${inhoud.map}" (per bestand hoogstens ${grootte(maximum)}). ` +
			"Je ziet niet wat er al in de map staat."
		aanleveren.hidden = false
	}

	const leverAan = async (bestand) => {
		const li = document.createElement("li")
		const naam = document.createElement("span")
		naam.textContent = bestand.name
		const stand = document.createElement("span")
		stand.className = "oas-grootte"
		li.append(naam, stand)
		voortgang.prepend(li)
		if (bestand.size > maximum) {
			stand.textContent = "te groot"
			stand.classList.add("oas-fout")
			return
		}
		try {
			stand.textContent = "0%"
			const start = await roep("upload_start", { naam: bestand.name, grootte: bestand.size })
			const delen = []
			let verstuurd = 0
			for (const deel of start.delen) {
				const stuk = bestand.slice((deel.nummer - 1) * start.deelgrootte, deel.nummer * start.deelgrootte)
				const r = await fetch(deel.url, { method: "PUT", body: stuk })
				if (!r.ok) throw new Error("Uploaden is mislukt")
				delen.push({ nummer: deel.nummer, etag: r.headers.get("ETag") })
				verstuurd += stuk.size
				stand.textContent = `${Math.floor((100 * verstuurd) / Math.max(1, bestand.size))}%`
			}
			const klaar = await roep("upload_klaar", { upload: start.upload, delen, afzender: afzender.value || null })
			stand.textContent = klaar.naam === bestand.name ? "ontvangen" : `ontvangen als ${klaar.naam}`
		} catch (e) {
			stand.textContent = e.message
			stand.classList.add("oas-fout")
		}
	}

	// Eén bestand tegelijk, in de volgorde van kiezen.
	const voegToe = (bestanden) => {
		for (const b of bestanden) wachtrij = wachtrij.then(() => leverAan(b))
	}
	kiezer.addEventListener("change", () => { voegToe([...kiezer.files]); kiezer.value = "" })
	vak.addEventListener("dragover", (ev) => { ev.preventDefault(); vak.classList.add("oas-erboven") })
	vak.addEventListener("dragleave", () => vak.classList.remove("oas-erboven"))
	vak.addEventListener("drop", (ev) => {
		ev.preventDefault()
		vak.classList.remove("oas-erboven")
		voegToe([...ev.dataTransfer.files])
	})

	form.addEventListener("submit", (ev) => {
		ev.preventDefault()
		wachtwoord = form.querySelector("input").value
		laad()
	})
	laad()
})()
</script>
{% endblock %}
