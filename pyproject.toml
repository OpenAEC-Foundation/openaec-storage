[project]
name = "openaec_storage"
authors = [{ name = "OpenAEC Studio BV", email = "openaecstudio@gmail.com" }]
description = "OpenAEC Storage: projectbestanden met ruimtes, versies, delen en desktop-sync (bytes in S3)"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
# Tests bootsen S3 na met moto (zie tests/hulp.py)
test = ["moto[s3]>=5"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
