[package]
name = "openaec-dav"
version = "0.1.0"
edition = "2021"
description = "WebDAV-toegang tot OpenAEC Storage: een dienst zonder eigen opslag of rechten, bovenop de Storage-API"
license = "AGPL-3.0-only"

[dependencies]
openaec-sync = { git = "https://github.com/OpenAEC-Foundation/openaec-cloud-desktop", branch = "storage-api" }
dav-server = "0.11"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
tempfile = "3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
